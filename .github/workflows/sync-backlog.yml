name: Sync Backlog to Issues

on:
  push:
    branches: [main]
    paths:
      - '.docs/story/**/*.md'
      - 'scripts/sync-backlog.mjs'
      - '.github/workflows/sync-backlog.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync backlog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-backlog.mjs

      - name: Commit issue numbers back
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .docs/story
          git commit -m "chore(backlog): 寫回 GitHub Issue 編號 [skip ci]"
          git push
